<div class="cotizaciones-list">
  <div class="cotizaciones-list__table-wrap">
    <table class="cotizaciones-list__table">
      <thead>
        <tr>
          <th>Número</th>
          <th>Fecha</th>
          <th>Cliente</th>
          <th>Vendedor</th>
          <th>Total</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of data()">
          <td>
            <strong>{{ item.numeroCompleto || item.numero || 'Sin número' }}</strong>
          </td>
          <td>{{ formatFecha(item.fecha) }}</td>
          <td>{{ item.cliente || 'Sin cliente' }}</td>
          <td>{{ item.vendedor || 'Sin vendedor' }}</td>
          <td>{{ item.total | currency:'CRC':'symbol-narrow':'1.0-2' }}</td>
          <td>
            <span class="cotizacion-badge" [ngClass]="getEstadoClass(item.estado)">
              {{ item.estado || 'Pendiente' }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
