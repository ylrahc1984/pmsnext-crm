<!--  vertical layouts -->
<ng-scrollbar style="height: calc(100vh - 70px)" exclude="'#mobile-collapse1'" visibility="hover">
  <div class="navbar-content">
    <ul class="nav pcoded-inner-navbar" (clickOutside)="fireOutClick()">
      @for (item of navigations; track item) {
        @if (item.type === 'item') {
          <app-nav-item [item]="item" />
        }
        @if (item.type === 'group' || item.type === 'collapse') {
          <app-nav-group [item]="item" [expandedRootId]="expandedRootId" (rootSectionChange)="onRootSectionChange($event)" />
        }
      }
    </ul>
    <div class="nav-developer-card" aria-label="Informacion del sistema">
      <div class="nav-developer-card__divider"></div>
      <div class="nav-developer-card__company">
        <i class="feather icon-briefcase" aria-hidden="true"></i>
        <span>{{ companyName() }}</span>
      </div>
      <div class="nav-developer-card__product">
        <strong>{{ productName }}</strong>
        <span>v{{ currentApplicationVersion }}</span>
      </div>
      <a class="nav-developer-card__developer" [href]="developerUrl" target="_blank" rel="noopener noreferrer">
        <span>{{ developerName }}</span>
        <i class="feather icon-external-link" aria-hidden="true"></i>
      </a>
    </div>
  </div>
</ng-scrollbar>
